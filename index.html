<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FinWise AI - Financial Planner</title>

<style>

*{box-sizing:border-box}

body{margin:0;padding:20px;background:#0b1020;color:white;font-family:Arial}

h1{color:#91a4ff}

.card{background:#171f35;padding:20px;border-radius:15px;margin:15px 0}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}

.amount{font-size:25px;font-weight:bold;margin-top:10px}

.green{color:#45d6a0}.red{color:#ff7785}.blue{color:#91a4ff}

input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #34405e;background:#10182b;color:white}

button{background:#6679ee;border:0;font-weight:bold}

table{width:100%;border-collapse:collapse}

td,th{text-align:left;padding:10px 5px;border-bottom:1px solid #34405e}

.bar{height:10px;background:#34405e;border-radius:10px}

.fill{height:10px;background:#91a4ff;border-radius:10px}

.insight{background:#202b45;padding:15px;border-radius:10px}

</style>

</head>
